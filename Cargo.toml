[package]
name = "oknef-back"
version = "0.1.0"
edition = "2024"
[dependencies]
webauthn-rs = "0.5.4"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
uuid = { version = "1.26.1", features = ["v4"] }
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["transport", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
[build-dependencies]
prost-build = "0.14.4"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"
